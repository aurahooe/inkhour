<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ink Hour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <div class="brand">Ink Hour<small>Vol. I · a living press</small></div>
      <div class="clock">This hour closes in<b id="remain">—</b></div>
      <nav class="top" id="nav"></nav>
    </header>
    <main id="root"></main>
    <footer class="colophon">
      <span>Printed in the browser. Bound in Postgres.</span>
      <span id="who">Unsigned</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
